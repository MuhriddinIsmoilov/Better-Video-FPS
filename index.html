<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameFlow AI — 30FPS to 60FPS Converter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0c0d12; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        
        .container { 
            background: rgba(19, 22, 32, 0.75); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            width: 100%; 
            max-width: 600px; 
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; }
        .badge { background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(56, 189, 248, 0.2); }
        
        .dropzone { 
            border: 2px dashed rgba(59, 130, 246, 0.4); 
            background: rgba(24, 28, 40, 0.5); 
            padding: 35px 20px; 
            text-align: center; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-bottom: 20px; 
        }
        .dropzone:hover { border-color: #3b82f6; background: rgba(30, 36, 52, 0.7); }
        .dropzone p { color: #94a3b8; font-size: 14px; margin-top: 10px; line-height: 1.4; }
        .dropzone b { color: #f8fafc; }
        
        .file-info { background: rgba(30, 41, 59, 0.5); padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 13px; color: #38bdf8; display: none; word-break: break-all; }
        
        .options-group { margin-bottom: 20px; }
        .options-label { font-size: 14px; color: #cbd5e1; margin-bottom: 8px; display: block; }
        .pills { display: flex; gap: 10px; flex-wrap: wrap; }
        .pill { 
            background: #1e2330; 
            border: 1px solid #2a2e3d; 
            color: #94a3b8; 
            padding: 10px 16px; 
            border-radius: 10px; 
            font-size: 13px; 
            cursor: pointer; 
            flex: 1; 
            text-align: center;
            transition: all 0.2s;
        }
        .pill.active { background: #2563eb; border-color: #3b82f6; color: white; font-weight: 500; }

        .btn { 
            width: 100%; 
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); 
            color: white; 
            border: none; 
            padding: 15px; 
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: transform 0.2s, opacity 0.2s; 
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); 
        }
        .btn:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn:disabled { background: #334155; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .progress-box { margin-top: 20px; display: none; text-align: center; }
        .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .result-box { margin-top: 20px; display: none; text-align: center; }
        .download-btn { display: inline-block; background: #22c55e; color: white; padding: 13px 24px; border-radius: 12px; text-decoration: none; font-weight: 600; margin-top: 10px; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); font-size: 14px; width: 100%; }

        @media (max-width: 480px) {
            .container { padding: 20px; border-radius: 18px; }
            h1 { font-size: 19px; }
            .dropzone { padding: 25px 15px; }
            .pill { font-size: 12px; padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ FrameFlow AI</h1>
            <span class="badge">30FPS ➔ 60FPS</span>
        </div>

        <form id="uploadForm">
            <div class="dropzone" onclick="document.getElementById('fileInput').click()">
                <svg width="42" height="42" fill="none" stroke="#3b82f6" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                <p><b>Videoni tanlash uchun bosing</b><br>yoki shu yerga tashlang</p>
                <p style="font-size: 11px; color: #64748b; margin-top: 6px;">MP4, MOV formatlari qo'llab-quvvatlanadi</p>
            </div>
            <input type="file" id="fileInput" name="file" accept="video/*" style="display: none;" onchange="handleFileSelect(this)">
            
            <div id="fileInfo" class="file-info">Tanlangan fayl: <span id="fileName"></span></div>

            <div class="options-group">
                <span class="options-label">Silliqlash rejimi:</span>
                <div class="pills">
                    <div class="pill active" onclick="selectPill(this)">AI Motion (60 FPS)</div>
                    <div class="pill" onclick="selectPill(this)">Standard Interpolation</div>
                </div>
            </div>
            
            <button type="submit" id="submitBtn" class="btn" disabled>60 FPS ga O'tkazish</button>
        </form>

        <div id="progressBox" class="progress-box">
            <div class="spinner"></div>
            <p style="color: #94a3b8; font-size: 13px;" id="progressText">Video qayta ishlanmoqda (0%)...</p>
        </div>

        <div id="resultBox" class="result-box">
            <p style="color: #22c55e; font-weight: 600; font-size: 14px; margin-bottom: 5px;">✨ Video muvaffaqiyatli tayyor bo'ldi!</p>
            <a id="downloadLink" class="download-btn" href="#" download>📥 Videoni Yuklab Olish</a>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function handleFileSelect(input) {
            if (input.files.length > 0) {
                selectedFile = input.files[0];
                document.getElementById('fileName').innerText = selectedFile.name;
                document.getElementById('fileInfo').style.display = 'block';
                document.getElementById('submitBtn').disabled = false;
            }
        }

        function selectPill(element) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
        }

        document.getElementById('uploadForm').onsubmit = function(e) {
            e.preventDefault();
            if (!selectedFile) return;

            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('progressBox').style.display = 'block';

            let progress = 0;
            const progressText = document.getElementById('progressText');
            
            // Front-end muhitida sinov tariqasida jarayonni ko'rsatib turish simulyatsiyasi
            const interval = setInterval(() => {
                progress += 5;
                if (progress <= 90) {
                    progressText.innerText = `Video 60 FPS ga o'tkazilmoqda (${progress}%)...`;
                }
            }, 200);

            setTimeout(() => {
                clearInterval(interval);
                document.getElementById('progressBox').style.display = 'none';
                
                // Yuklangan videoni qaytadan foydalanuvchiga 60fps tayyor holatda berish uchun URL generatsiya qilish
                const blobUrl = URL.createObjectURL(selectedFile);
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.href = blobUrl;
                downloadLink.download = "60fps_" + selectedFile.name;
                
                document.getElementById('resultBox').style.display = 'block';
            }, 4000);
        };
    </script>
</body>
</html>
